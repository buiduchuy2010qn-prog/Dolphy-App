name: Build & Release Dolphy VN APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.11 (for Chaquopy)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Dolphy VN APK (Fixed Keystore & Auto-Increment Version)
        run: |
          mkdir -p ~/.android
          rm -f ~/.android/debug.keystore app/dolphy-vn-fixed.p12 app/dolphy-vn-fixed.jks
          openssl pkcs12 -export -in app/dolphy-vn-cert.pem -inkey app/dolphy-vn-key.pem -out app/dolphy-vn-fixed.p12 -name androiddebugkey -passout pass:android
          keytool -importkeystore -srckeystore app/dolphy-vn-fixed.p12 -srcstoretype PKCS12 -srcstorepass android -destkeystore ~/.android/debug.keystore -deststoretype JKS -deststorepass android -destkeypass android -noprompt
          cp ~/.android/debug.keystore app/dolphy-vn-fixed.jks
          rm -f app/dolphy-vn-fixed.p12
          rm -rf app/src/main/assets/Flipper-IRDB-main/.github app/src/main/assets/Flipper-IRDB-main/.fff-ir-lint.json app/src/main/assets/Flipper-IRDB-main/.gitattributes app/src/main/assets/Flipper-IRDB-main/.gitignore || true
          java -Xmx64m -Xms64m -classpath gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk Dolphy-VN-v3.1.apk
          cp app/build/outputs/apk/debug/app-debug.apk Dolphy-VN-v3.0.apk
          cp app/build/outputs/apk/debug/app-debug.apk Dolphy-VN-v2.9.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dolphy-VN-APK
          path: Dolphy-VN-v3.1.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v3.1-vn"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Dolphy-VN-v3.1.apk --clobber
          else
            gh release create "$TAG" Dolphy-VN-v3.1.apk \
              --title "Dolphy VN v3.1 (Quét Mạng LAN Siêu Tốc 0.3s + Song Song Hóa 9 Tầng Tên + Đo Ping/DNS Tức Thì)" \
              --notes "### Bản nâng cấp Dolphy VN v3.1 (Ultra-Fast 0.3s LAN Scan & Full Feature Audit)
          - **Tăng tốc Quét Mạng LAN & Chọn thiết bị trong LAN lên gấp 8 lần**:
            - **Hiển thị tức thì Pha 1 (< 0.3 giây)**: Đánh thức ARP bằng UDP rồi đọc bảng láng giềng hạt nhân (\`ip neigh\` / \`/proc/net/arp\`) để hiện danh sách thiết bị đang online ngay lập tức chỉ sau ~0.25 giây.
            - **Quét 19 cổng TCP & Phân giải tên 9 tầng song song (\`async\`/\`awaitAll\`)**: Loại bỏ hoàn toàn việc quét tuần tự 19 cổng trên các IP trống; toàn bộ dải 254 IP hoàn tất quét sâu chỉ trong **~1.4 giây** (thay vì 12–15 giây ở bản v3.0).
            - **Tối ưu nhận diện HTTP**: Chỉ kiểm tra Header HTTP trên các cổng thực sự đang mở (0ms độ trễ cho điện thoại không mở cổng web).
          - **Đo Ping Nhanh & Tối Ưu DNS/Kênh chạy song song (< 0.4 giây)**: Đo đồng thời Router, Cloudflare, Google, Quad9 thay vì chờ lần lượt.
          - **Hỗ trợ thao tác trên Wi-Fi đang kết nối ngay cả khi tắt Vị trí (GPS)**: Cho phép mở trực tiếp Menu kiểm thử Router, Chọn thiết bị LAN và Admin Panel trên mạng Wi-Fi hiện tại mà không bị chặn bởi hộp thoại bật GPS.
          - **Giữ nguyên chứng chỉ ký APK cố định & Tự động xóa file APK sau khi cài OTA**."
          fi
          if gh release view "v3.0-vn" >/dev/null 2>&1; then
            gh release upload "v3.0-vn" Dolphy-VN-v3.0.apk --clobber
          fi
          if gh release view "v2.9-vn" >/dev/null 2>&1; then
            gh release upload "v2.9-vn" Dolphy-VN-v2.9.apk --clobber
          fi
