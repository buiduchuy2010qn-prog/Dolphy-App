name: Build & Release Dolphy VN APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.11 (for Chaquopy)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Dolphy VN APK (Fixed Keystore & Auto-Increment Version)
        run: |
          mkdir -p ~/.android
          rm -f ~/.android/debug.keystore app/dolphy-vn-fixed.p12 app/dolphy-vn-fixed.jks
          openssl pkcs12 -export -in app/dolphy-vn-cert.pem -inkey app/dolphy-vn-key.pem -out app/dolphy-vn-fixed.p12 -name androiddebugkey -passout pass:android
          keytool -importkeystore -srckeystore app/dolphy-vn-fixed.p12 -srcstoretype PKCS12 -srcstorepass android -destkeystore ~/.android/debug.keystore -deststoretype JKS -deststorepass android -destkeypass android -noprompt
          cp ~/.android/debug.keystore app/dolphy-vn-fixed.jks
          rm -f app/dolphy-vn-fixed.p12
          rm -rf app/src/main/assets/Flipper-IRDB-main/.github app/src/main/assets/Flipper-IRDB-main/.fff-ir-lint.json app/src/main/assets/Flipper-IRDB-main/.gitattributes app/src/main/assets/Flipper-IRDB-main/.gitignore || true
          java -Xmx64m -Xms64m -classpath gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk Dolphy-VN-v2.8.apk
          cp app/build/outputs/apk/debug/app-debug.apk Dolphy-VN-v2.7.apk
          cp app/build/outputs/apk/debug/app-debug.apk Dolphy-VN-v2.6.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dolphy-VN-APK
          path: Dolphy-VN-v2.8.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v2.8-vn"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Dolphy-VN-v2.8.apk --clobber
          else
            gh release create "$TAG" Dolphy-VN-v2.8.apk \
              --title "Dolphy VN v2.8 (Siêu Mượt 120Hz + Dò Tên Thiết Bị LAN 7 Tầng + Cài Đè Vĩnh Viễn)" \
              --notes "### Bản nâng cấp Dolphy VN v2.8 (Ultra-Smooth 120Hz & Real LAN Device Identity)
          - **Chứng chỉ ký cố định (Fixed Keystore) & Tự động tăng VersionCode**: Từ bản v2.8 trở đi, mọi bản cập nhật đều dùng chung 1 chữ ký cố định và tự động tăng mã phiên bản, hỗ trợ cài đè 100% không bao giờ bị xung đột gói.
          - **Dò Tên Thiết Bị Thực 7 Tầng (LAN Scanner)**: Truy vấn trực tiếp DNS Ngược của Router (\`.1:53\`), NetBIOS (\`UDP 137\`), mDNS (\`5353\`), XML \`<friendlyName>\` của UPnP/SSDP và Google Cast (\`8008\`). Hỗ trợ đặt tên ghi nhớ (\`✏️\`) và nút 1 chạm **Chép MAC/IP & Mở Router để Chặn (Kick)**.
          - **Siêu Mượt 120Hz (High Refresh Rate)**: Kích hoạt tần số quét cao nhất của màn hình, tắt Compose Live Literals (\`isDebuggable = false\`), loại bỏ 200% GPU Overdraw và đệm RAM cho Animation."
          fi
          if gh release view "v2.7-vn" >/dev/null 2>&1; then
            gh release upload "v2.7-vn" Dolphy-VN-v2.7.apk --clobber
          fi
          if gh release view "v2.6-vn" >/dev/null 2>&1; then
            gh release upload "v2.6-vn" Dolphy-VN-v2.6.apk --clobber
          fi
