name: Build & Release Dolphy VN APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.11 (for Chaquopy)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Dolphy VN APK
        run: |
          rm -rf app/src/main/assets/Flipper-IRDB-main/.github app/src/main/assets/Flipper-IRDB-main/.fff-ir-lint.json app/src/main/assets/Flipper-IRDB-main/.gitattributes app/src/main/assets/Flipper-IRDB-main/.gitignore || true
          java -Xmx64m -Xms64m -classpath gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk Dolphy-VN-v2.7.apk
          cp app/build/outputs/apk/debug/app-debug.apk Dolphy-VN-v2.6.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dolphy-VN-APK
          path: Dolphy-VN-v2.7.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v2.7-vn"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Dolphy-VN-v2.7.apk --clobber
          else
            gh release create "$TAG" Dolphy-VN-v2.7.apk \
              --title "Dolphy VN v2.7 (Bản Nâng Cấp Toàn Diện - Tiếng Việt & English)" \
              --notes "### Bản nâng cấp Dolphy VN v2.7 (Full Upgrade Edition)
          - **Bảng Điều Khiển Thiết bị LAN & Router chuyên sâu**: Chạm vào bất kỳ thiết bị nào trong mục Quét LAN để mở bảng công cụ: Đo Ping trực tiếp, Quét sâu 25 cổng dịch vụ, Đánh thức máy tính từ xa (Wake-on-LAN), Sao chép IP/MAC, Mở Web quản trị và Bảng điều khiển Router.
          - **Nhận diện MAC & Hãng sản xuất thế hệ mới (Android 10–15)**: Bổ sung cơ chế đọc bảng láng giềng hệ thống (\`ip neigh\`) và từ điển thiết bị tại Việt Nam (Viettel, VNPT iGate, FPT, TP-Link, Mercusys, Ruijie, MikroTik, Ezviz, Imou, Espressif ESP32...).
          - **Bảng Thông số Wi-Fi Thời gian thực & Đo Ping Nhanh**: Hiển thị trực tiếp cường độ sóng dBm, tốc độ Mbps, băng tần 2.4G/5G + Kênh sóng (Channel), chuẩn bảo mật WPA2/WPA3 và đo độ trễ đồng thời tới Router / DNS 1.1.1.1 / 8.8.8.8.
          - **Chế độ Ngụy trang Biểu tượng Màn hình chính (Cloak Mode)**: Đổi icon và tên ngoài màn hình chính thành **Dolphy VN**, **Máy tính** hoặc **Ghi chú** ngay trong Cài đặt.
          - **Khóa bảo mật bằng Mã PIN (App PIN Lock)**: Đặt mã PIN 4–8 số bảo vệ ứng dụng khi khởi động.
          - **Tối ưu hóa dung lượng APK**: Loại bỏ thư viện giả lập x86 thừa, giúp APK nhẹ và cài đặt nhanh hơn."
          fi
          if gh release view "v2.6-vn" >/dev/null 2>&1; then
            gh release upload "v2.6-vn" Dolphy-VN-v2.6.apk --clobber
          fi
