name: Build & Release Dolphy VN APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.11 (for Chaquopy)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Dolphy VN APK (Fixed Keystore & Auto-Increment Version)
        run: |
          mkdir -p ~/.android
          rm -f ~/.android/debug.keystore app/dolphy-vn-fixed.p12 app/dolphy-vn-fixed.jks
          openssl pkcs12 -export -in app/dolphy-vn-cert.pem -inkey app/dolphy-vn-key.pem -out app/dolphy-vn-fixed.p12 -name androiddebugkey -passout pass:android
          keytool -importkeystore -srckeystore app/dolphy-vn-fixed.p12 -srcstoretype PKCS12 -srcstorepass android -destkeystore ~/.android/debug.keystore -deststoretype JKS -deststorepass android -destkeypass android -noprompt
          cp ~/.android/debug.keystore app/dolphy-vn-fixed.jks
          rm -f app/dolphy-vn-fixed.p12
          rm -rf app/src/main/assets/Flipper-IRDB-main/.github app/src/main/assets/Flipper-IRDB-main/.fff-ir-lint.json app/src/main/assets/Flipper-IRDB-main/.gitattributes app/src/main/assets/Flipper-IRDB-main/.gitignore || true
          java -Xmx64m -Xms64m -classpath gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk Dolphy-VN-v2.9.apk
          cp app/build/outputs/apk/debug/app-debug.apk Dolphy-VN-v2.8.apk
          cp app/build/outputs/apk/debug/app-debug.apk Dolphy-VN-v2.7.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dolphy-VN-APK
          path: Dolphy-VN-v2.9.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v2.9-vn"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Dolphy-VN-v2.9.apk --clobber
          else
            gh release create "$TAG" Dolphy-VN-v2.9.apk \
              --title "Dolphy VN v2.9 (Dò Tên Thiết Bị LAN 9 Tầng + Sửa Quét Sót + Cập Nhật OTA Trực Tiếp)" \
              --notes "### Bản nâng cấp Dolphy VN v2.9 (9-Layer Real Device Name & In-App OTA)
          - **Dò Tên Thiết Bị 9 Tầng trong cả Kiểm thử Wi-Fi (Lab) & Quét LAN**: Lấy chính xác tên người dùng đặt hoặc tên dòng máy gốc qua DNS Ngược Router (\`.1:53\` DHCP Hostname), mDNS/Bonjour (\`5353\`), AirPlay \`/info\` (nhận diện đời iPhone/iPad), Google Cast (\`8008\`), UPnP XML \`<friendlyName>\` và NetBIOS (\`UDP 137\`).
          - **Sửa triệt để lỗi chỉ quét thấy 1 thiết bị (Gateway)**: Ưu tiên dải mạng Wi-Fi (\`wlan0\`) thay vì nhầm sang mạng 4G LTE (\`VoLTE\`), bổ sung gói đánh thức ARP (\`UDP Warmup\`) và quét theo lô 32 IP chống nghẽn luồng.
          - **Cập nhật OTA trực tiếp trong ứng dụng**: Kiểm tra bản mới ngay khi mở app hoặc trong **Cài đặt -> Kiểm tra cập nhật (OTA)**, hiển thị dung lượng MB đang tải và cài đè 100% không xung đột."
          fi
          if gh release view "v2.8-vn" >/dev/null 2>&1; then
            gh release upload "v2.8-vn" Dolphy-VN-v2.8.apk --clobber
          fi
          if gh release view "v2.7-vn" >/dev/null 2>&1; then
            gh release upload "v2.7-vn" Dolphy-VN-v2.7.apk --clobber
          fi
